<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tạo chữ ký email - CTCP Yến Sào Nha Trang</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
    background: #eef1f5;
    margin: 0;
    color: #222;
  }
  .header {
    background: #fff;
    border-bottom: 3px solid #d30000;
    padding: 14px 28px;
  }
  .header .brand { color: #d30000; font-weight: 700; font-size: 18px; }
  .header .sub   { color: #888; font-size: 12.5px; margin-top: 2px; }
  .layout {
    display: flex;
    gap: 20px;
    max-width: 1220px;
    margin: 22px auto;
    padding: 0 20px;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  .panel {
    background: #fff;
    border: 1px solid #e3e6ea;
    border-radius: 10px;
    padding: 20px 22px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .form-panel   { width: 400px; flex: 0 0 400px; }
  .preview-panel{ flex: 1 1 520px; min-width: 0; }
  .field { margin-bottom: 14px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #333;
    margin-bottom: 5px;
  }
  input {
    width: 100%;
    padding: 8px 10px;
    font-size: 14px;
    border: 1px solid #c9ced6;
    border-radius: 6px;
    outline: none;
  }
  input:focus { border-color: #d30000; box-shadow: 0 0 0 2px rgba(211,0,0,.12); }
  .hint { font-size: 11.5px; color: #9aa0a6; margin-top: 4px; }
  .actions { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  button {
    border: none;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 13.5px;
    cursor: pointer;
    font-weight: 600;
    font-family: inherit;
  }
  .btn-primary { background: #d30000; color: #fff; }
  .btn-primary:hover { background: #b00000; }
  .btn-ghost { background: #fff; color: #0d3846; border: 1px solid #0d3846; }
  .btn-ghost:hover { background: #f0f4f6; }
  .msg { font-size: 12.5px; margin-top: 12px; min-height: 18px; line-height: 1.45; }
  .msg.err { color: #d30000; }
  .msg.ok  { color: #0a8043; }
  .preview-head { font-size: 12px; color: #666; margin-bottom: 8px; font-weight: 600; }
  #previewBox {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    min-height: 280px;
    padding: 24px 18px;
    overflow: auto;
  }
  #previewBox > div { margin: 0 auto; }
  .hint-empty {
    color: #b0b6bd;
    text-align: center;
    padding: 90px 20px;
    font-size: 13.5px;
  }
  @media (max-width: 920px) {
    .form-panel { flex: 1 1 100%; width: auto; }
    .preview-panel { flex: 1 1 100%; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="brand">CÔNG TY CỔ PHẦN YẾN SÀO NHA TRANG</div>
  <div class="sub">Công cụ tạo chữ ký email từ mẫu chuẩn của công ty</div>
</div>

<main class="layout">

  <!-- ===================== FORM ===================== -->
  <section class="panel form-panel">
    <div class="field">
      <label for="fName">Họ và tên *</label>
      <input id="fName" type="text" autocomplete="off" placeholder="VD: Nguyễn Văn An">
    </div>
    <div class="field">
      <label for="fJob">Chức danh</label>
      <input id="fJob" type="text" autocomplete="off" placeholder="VD: Trưởng phòng Kỹ thuật">
    </div>
    <div class="field">
      <label for="fMail">Email *</label>
      <input id="fMail" type="email" autocomplete="off" placeholder="VD: ten.nv@ysnt.com.vn">
    </div>
    <div class="field">
      <label for="fPhone">Số ĐT di động</label>
      <input id="fPhone" type="text" autocomplete="off" placeholder="VD: 912345678">
      <div class="hint">Chỉ cần nhập số, hệ thống tự thêm (+84). Có thể nhập 0912..., +84..., 84...</div>
    </div>
    <div class="field">
      <label for="fEmpId">Mã nhân viên *</label>
      <input id="fEmpId" type="text" autocomplete="off" placeholder="VD: NV0123">
      <div class="hint">Dùng làm tên file khi tải xuống: &lt;mã nhân viên&gt;.html</div>
    </div>

    <div class="actions">
      <button id="btnDownload" class="btn-primary">Tải file .html</button>
      <button id="btnCopy" class="btn-ghost">Copy HTML để dán vào Outlook / Gmail</button>
    </div>
    <div id="msg" class="msg"></div>
  </section>

  <!-- ===================== PREVIEW ===================== -->
  <section class="panel preview-panel">
    <div class="preview-head">XEM TRƯỚC CHỮ KÝ</div>
    <div id="previewBox">
      <div class="hint-empty">Nhập họ tên và email hợp lệ để xem trước chữ ký</div>
    </div>
  </section>

</main>

<script>
(function () {
  'use strict';

  var tpl = document.getElementById('sigTemplate').textContent;
  var $ = function (id) { return document.getElementById(id); };

  function msg(text, isErr) {
    var el = $('msg');
    el.textContent = text;
    el.className = 'msg ' + (isErr ? 'err' : 'ok');
  }

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function isValidMail(s) {
    return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s);
  }

  function normPhone(s) {
    var t = s.trim();
    if (!t) return '';
    var d = t.replace(/[\s.\-()+]/g, '');
    if (/^84(\d{8,10})$/.test(d)) return d.slice(2);
    if (/^0(\d{8,10})$/.test(d))  return d.slice(1);
    return t;
  }

  function safeFile(name) {
    return name.trim().length > 0 &&
           !/[/\\:*?"<>|]/.test(name) &&
           name.trim() !== '.' && name.trim() !== '..';
  }

  function current() {
    return {
      name:  $('fName').value.trim(),
      job:   $('fJob').value.trim(),
      mail:  $('fMail').value.trim(),
      phone: $('fPhone').value.trim(),
      empid: $('fEmpId').value.trim()
    };
  }

  // Thay the placeholder -> HTML hoan chinh (luon bat dau tu mau goc)
  function buildHtml() {
    var d = current();
    var h = tpl;

    // Chuc danh bo trong: xoa luon cum "| [job]" va span trang tri
    if (!d.job) {
      h = h.split('<span style="font-weight: normal; color: #d30000;">| [job] </span>').join('');
      h = h.split('[job]').join('');
    }
    // So dien thoai bo trong: xoa luon o "Di dong" tren chu ky
    if (!d.phone) {
      h = h.split('<td><strong>Di động:</strong> (+84) [phone]</td>').join('');
      h = h.split('[phone]').join('');
    }

    var ph = normPhone(d.phone);
    h = h.split('[username]').join(esc(d.name))
         .split('[job]').join(esc(d.job))
         .split('[mail]').join(esc(d.mail))
         .split('[phone]').join(esc(ph));
    return h;
  }

  function renderPreview() {
    var d = current();
    if (!d.name || !isValidMail(d.mail)) {
      $('previewBox').innerHTML = '<div class="hint-empty">Nhập họ tên và email hợp lệ để xem trước chữ ký</div>';
      return;
    }
    $('previewBox').innerHTML = buildHtml();
  }

  ['fName', 'fJob', 'fMail', 'fPhone', 'fEmpId'].forEach(function (id) {
    $(id).addEventListener('input', renderPreview);
  });

  // ---- Tai file .html ----
  $('btnDownload').addEventListener('click', function () {
    var d = current();
    var err = null;
    if (!d.name)            err = 'Vui lòng nhập HỌ VÀ TÊN.';
    else if (!isValidMail(d.mail)) err = 'Email không hợp lệ (VD: ten.nv@ysnt.com.vn).';
    else if (!d.empid)      err = 'Vui lòng nhập MÃ NHÂN VIÊN (dùng làm tên file).';
    else if (!safeFile(d.empid)) err = 'Mã nhân viên chứa ký tự không hợp lệ cho tên file ( \\ / : * ? " < > | ).';
    if (err) { msg(err, true); return; }

    try {
      var html = buildHtml();
      var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = d.empid + '.html';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
      msg('Đã tải file ' + d.empid + '.html về máy. Bạn có thể mở xem hoặc dùng làm file chữ ký Outlook.', false);
    } catch (e) {
      msg('Lỗi khi tải file: ' + e.message, true);
    }
  });

  // ---- Copy HTML (rich text) de dan vao Outlook / Gmail ----
  $('btnCopy').addEventListener('click', function () {
    var d = current();
    var err = null;
    if (!d.name) err = 'Vui lòng nhập HỌ VÀ TÊN.';
    else if (!isValidMail(d.mail)) err = 'Email không hợp lệ (VD: ten.nv@ysnt.com.vn).';
    if (err) { msg(err, true); return; }

    var html = buildHtml();
    var holder = document.createElement('div');
    holder.setAttribute('contenteditable', 'true');
    holder.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;overflow:hidden;';
    holder.innerHTML = html;
    document.body.appendChild(holder);

    var range = document.createRange();
    range.selectNodeContents(holder);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);

    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }

    sel.removeAllRanges();
    document.body.removeChild(holder);

    if (ok) {
      msg('Đã copy chữ ký (giữ nguyên định dạng). Vào Outlook/Gmail: soạn mail mới → bấm chuột phải vào vùng nội dung → Paste.', false);
    } else {
      msg('Không copy tự động được (trình duyệt chặn). Cách khác: bôi đen toàn bộ vùng XEM TRƯỚC bên phải → Ctrl+C → Paste vào mail.', true);
    }
  });

})();
</script>
</body>
</html>
